name: Recommended Articles

on:
  # Latest Articles（毎時 0 分、6 時間ごと）の 30 分後に走らせ、
  # Latest に新しく載った記事をおすすめから除外した状態に追従させる
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-readme:
    # 依存パッケージなしの Node スクリプトと API 呼び出しだけなので ubuntu-slim で十分
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update recommended articles
        run: node scripts/recommend-articles.mjs

      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update recommended articles - [Skip GitHub Action]" README.md
          # 他のワークフローが先に README を更新していても push できるよう rebase してから push
          git pull --rebase
          git push
